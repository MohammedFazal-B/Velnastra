services:
  qdrant:
    image: qdrant/qdrant@sha256:12364fe851b9f17356fc88189fc06d1b521262e04659ec7345975b00c9246a10
    container_name: qdrant
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped

  firewall:
    image: prompt-firewall:gpu
    container_name: firewall-app
    stop_grace_period: 120s
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 180s
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app
      - ./hf_cache:/root/.cache/huggingface/hub
      - ./models:/app/models
    depends_on:
      - qdrant
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - .env
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HUB_OFFLINE=1
      - PYTHONDONTWRITEBYTECODE=1
      - CUDA_CACHE_PATH=/app/hf_cache/cuda
      - QDRANT_URL=http://qdrant:6333
      - EMBEDDING_DEVICE=cpu
      - INGESTION_DEVICE=cuda
      - FIREWALL_MODE=server
      - FORCE_REBUILD=${FORCE_REBUILD:-false}
    stdin_open: true
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
